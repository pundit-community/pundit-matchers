name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Specs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        channel: ["stable"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          rubygems: latest
      - name: Run specs
        env:
          # Raise on any string literal mutation, to stay ready for frozen string
          # literals by default.
          # See https://gist.github.com/fxn/bf4eed2505c76f4fca03ab48c43adc72
          RUBYOPT: --enable=frozen-string-literal --debug=frozen-string-literal
        run: bundle exec rake
